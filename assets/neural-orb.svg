<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#06ffa5" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b18"/>
      <stop offset="100%" stop-color="#0f0726"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#7c3aed;#06ffa5;#00d4ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#06ffa5;#00d4ff;#7c3aed" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid line { stroke:#00d4ff; stroke-opacity:.12; }
      .lat  { fill:none; stroke:#00d4ff; stroke-opacity:.35; stroke-width:1; }
      .mer  { fill:none; stroke:#7c3aed; stroke-opacity:.7; stroke-width:1.2; }
      .orb  { fill:none; stroke-width:1.4; stroke-dasharray:4 6; }
      .label{ font-family:'Fira Code',monospace; font-size:13px; fill:#8892b0; }
      .big  { font-family:'Fira Code',monospace; font-weight:700; font-size:30px; }
      .float{ animation: float 4s ease-in-out infinite; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      .spin { transform-origin:450px 160px; animation: spin 18s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse{ animation: pulse 2.4s ease-in-out infinite; transform-origin:450px 160px; }
      @keyframes pulse { 0%,100%{opacity:.55; transform:scale(.92)} 50%{opacity:1; transform:scale(1.06)} }
    </style>
  </defs>

  <rect width="900" height="320" rx="18" fill="url(#bg)"/>

  <!-- perspective grid floor (3D) -->
  <g class="grid">
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="265" x2="900" y2="265"/>
    <line x1="0" y1="283" x2="900" y2="283"/><line x1="0" y1="305" x2="900" y2="305"/>
    <line x1="450" y1="245" x2="450" y2="320"/>
    <line x1="450" y1="245" x2="300" y2="320"/><line x1="450" y1="245" x2="600" y2="320"/>
    <line x1="450" y1="245" x2="150" y2="320"/><line x1="450" y1="245" x2="750" y2="320"/>
    <line x1="450" y1="245" x2="0" y2="320"/><line x1="450" y1="245" x2="900" y2="320"/>
    <line x1="450" y1="245" x2="-200" y2="320"/><line x1="450" y1="245" x2="1100" y2="320"/>
  </g>

  <!-- glow core -->
  <circle cx="450" cy="160" r="110" fill="url(#core)" class="pulse"/>

  <!-- 3D rotating wireframe globe -->
  <g filter="url(#glow)">
    <circle cx="450" cy="160" r="80" fill="none" stroke="#00d4ff" stroke-opacity=".8" stroke-width="1.5"/>
    <ellipse class="lat" cx="450" cy="160" rx="80" ry="22"/>
    <ellipse class="lat" cx="450" cy="120" rx="69" ry="17"/>
    <ellipse class="lat" cx="450" cy="200" rx="69" ry="17"/>
    <ellipse class="lat" cx="450" cy="90"  rx="42" ry="10"/>
    <ellipse class="lat" cx="450" cy="230" rx="42" ry="10"/>
    <ellipse class="mer" cx="450" cy="160" rx="80" ry="80"><animate attributeName="rx" values="80;0;80" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse class="mer" cx="450" cy="160" rx="80" ry="80"><animate attributeName="rx" values="0;80;0" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse class="mer" cx="450" cy="160" rx="40" ry="80"><animate attributeName="rx" values="40;80;40;0;40" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse class="mer" cx="450" cy="160" rx="40" ry="80"><animate attributeName="rx" values="40;0;40;80;40" dur="4s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- tilted orbits with electrons (3D depth via opacity) -->
  <g class="spin">
    <ellipse class="orb" cx="450" cy="160" rx="150" ry="38" stroke="#06ffa5" transform="rotate(-18 450 160)"/>
    <ellipse class="orb" cx="450" cy="160" rx="150" ry="38" stroke="#00d4ff" transform="rotate(35 450 160)"/>
  </g>
  <circle r="6" fill="#06ffa5" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M300,160 a150,38 0 1,0 300,0 a150,38 0 1,0 -300,0" rotate="auto"/>
    <animate attributeName="r" values="7;3;7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#ff6b6b" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M600,160 a150,38 0 1,0 -300,0 a150,38 0 1,0 300,0"/>
    <animate attributeName="r" values="3;7;3" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#f9ab00" filter="url(#glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M450,40 a40,120 0 1,0 0,240 a40,120 0 1,0 0,-240"/>
  </circle>

  <!-- left neural net -->
  <g class="float" stroke="#7c3aed" stroke-opacity=".5" stroke-width="1">
    <line x1="60" y1="100" x2="140" y2="80"/><line x1="60" y1="100" x2="140" y2="160"/><line x1="60" y1="100" x2="140" y2="240"/>
    <line x1="60" y1="200" x2="140" y2="80"/><line x1="60" y1="200" x2="140" y2="160"/><line x1="60" y1="200" x2="140" y2="240"/>
    <line x1="140" y1="80" x2="210" y2="160"/><line x1="140" y1="160" x2="210" y2="160"/><line x1="140" y1="240" x2="210" y2="160"/>
    <g stroke="none">
      <circle cx="60" cy="100" r="7" fill="#00d4ff"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="200" r="7" fill="#00d4ff"><animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="80"  r="7" fill="#7c3aed"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="160" r="7" fill="#7c3aed"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="240" r="7" fill="#7c3aed"><animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="160" r="9" fill="#06ffa5"><animate attributeName="r" values="7;10;7" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#fff"><animateMotion dur="1.6s" repeatCount="indefinite" path="M60,100 L140,160 L210,160"/></circle>
      <circle r="3" fill="#fff"><animateMotion dur="2.1s" repeatCount="indefinite" path="M60,200 L140,80 L210,160"/></circle>
    </g>
  </g>
  <text x="70" y="290" class="label">input → hidden → output</text>

  <!-- right text -->
  <g class="float" style="animation-delay:-2s">
    <text x="640" y="120" class="big" fill="url(#txt)">AI · ML</text>
    <text x="640" y="152" class="label">&gt; model.fit(data)</text>
    <text x="640" y="174" class="label">&gt; deploy --api fastapi</text>
    <text x="640" y="196" class="label" fill="#06ffa5">✔ impact delivered<animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/></text>
  </g>

  <!-- floating particles -->
  <g fill="#00d4ff">
    <circle cx="280" cy="60" r="1.6"><animate attributeName="cy" values="60;20;60" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="250" r="1.6"><animate attributeName="cy" values="250;210;250" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="240" r="1.2" fill="#06ffa5"><animate attributeName="cy" values="240;200;240" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="50" r="1.4" fill="#7c3aed"><animate attributeName="cy" values="50;90;50" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="40" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="40" r="1.4" fill="#06ffa5"><animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
